<!DOCTYPE html>
<html>
<head>
    <title>雯丽的小窝</title>
    <meta charset="UTF-8">
    <style>
        /* 使用Flexbox布局，图片并排显示 */
        .image-container {
            display: flex;
            justify-content: space-between;  /* 图片均匀分布 */
            gap: 15px;                       /* 图片间距 */
            max-width: 1200px;
            margin: 20px auto;
            flex-wrap: nowrap;               /* 强制不换行 */
        }
        .image-container img {
            width: 23%;                      /* 每张图片宽度约23%（留出间距） */
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            object-fit: cover;
            transition: transform 0.3s;
        }
        .image-container img:hover {
            transform: scale(1.05);          /* 悬停放大效果 */
        }
        /* 响应式设计：小屏幕时自动换行 */
        @media (max-width: 768px) {
            .image-container {
                flex-wrap: wrap;             /* 允许换行 */
            }
            .image-container img {
                width: 48%;                  /* 每行显示2张 */
                margin-bottom: 10px;
            }
        }
        @media (max-width: 480px) {
            .image-container img {
                width: 100%;                 /* 手机屏幕每行1张 */
            }
        }
    </style>
</head>
<body>
